<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/contacts.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <section class="contacts">
        <div class="title-page">
            <h5 class="title">FALE COM A GENTE</h5>
            <h2 class="sub-title">Contato </h2>
        </div>
        <div class="card-contacts">
            <img src="../img/Contact.png" alt="Imagem" class="card-image-contacts">
            <div class="card-content-contacts">
                <form action="" class="card-content-form-contacts">
                    <h3 class="card-content-form-title-contacts">Conheça melhor nossas soluções</h3>
                    <p class="card-content-form-sub-title-contacts">Preencha o formulário para entrar em contato com nossa equipe.</p>
                    <h5 class="card-content-form-label-contacts">Nome</h5>
                    <input type="text" name="name" id="name" class="card-content-form-input-contacts">
                    <h5 class="card-content-form-label-contacts">E-Mail</h5>
                    <input type="email" name="email" id="email" class="card-content-form-input-contacts">
                    <h5 class="card-content-form-label-contacts">Empresa</h5>
                    <input type="text" name="empresa" id="enpresa" class="card-content-form-input-contacts">
                    <h5 class="card-content-form-label-contacts" >Mensagem</h5>
                    <input type="text" name="mensagem" id="mensagem" class="card-content-form-input-contacts">
                    <button type="submit" class="card-content-form-button-contacts">ENVIAR</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
